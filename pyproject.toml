[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "respond-spectra"
version = "0.1.0"
description = "Response-driven spectral augmentation prototype for small-sample chemometric modeling."
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "scipy",
  "scikit-learn",
  "pandas",
  "torch",
  "smogn==0.1.2",
  "ImbalancedLearningRegression==0.0.2",
]

[tool.setuptools.packages.find]
include = ["respond_spectra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
